name: Build TuneBox VST3

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: List artifacts
        run: dir build\TuneBox_artefacts\Release\VST3 /s
        shell: cmd

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TuneBox-VST3-Windows
          path: build/TuneBox_artefacts/Release/VST3/TuneBox.vst3/
          retention-days: 90

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: TuneBox-Standalone-Windows
          path: build/TuneBox_artefacts/Release/Standalone/TuneBox.exe
          retention-days: 90
